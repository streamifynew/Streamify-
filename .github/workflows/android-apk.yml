name: Build Streamify APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          gradle :app:assembleDebug \
            -PTMDB_API_KEY="${{ secrets.TMDB_API_KEY }}" \
            -PVERSION_CODE="${{ github.run_number }}" \
            --stacktrace
        working-directory: android-app

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk streamify.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: streamify-debug-apk
          path: streamify.apk

      - name: Publish release (the app reads this to find updates)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Streamify build ${{ github.run_number }}
          files: streamify.apk
          make_latest: true
  
